# Urbe preview stack: every box's documented dev/preview server on a fixed port.
# compose/box-start.sh checks the lock hash when a service starts and installs into its
# named volume when needed. Wipe every install: docker compose down -v

name: urbe

x-box: &box
  image: node:22
  init: true
  entrypoint: /work/box-start.sh

# The user every box runs as; override with BOX_UID=$(id -u) BOX_GID=$(id -g) when not 1000.
x-user: &user
  BOX_UID: "${BOX_UID:-1000}"
  BOX_GID: "${BOX_GID:-1000}"

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 180s

x-engine-volumes: &engine-volumes
  - ./compose/box-start.sh:/work/box-start.sh:ro
  - ./engine:/work/engine
  - ./quests:/work/quests:ro
  - quests_modules:/work/quests/node_modules:ro
  - engine_modules:/work/engine/node_modules
  - ./atlas:/work/atlas:ro
  - atlas_modules:/work/atlas/node_modules:ro
  - ./connections:/work/connections:ro
  - ./exterior:/work/exterior:ro
  - exterior_modules:/work/exterior/node_modules:ro
  - ./interior:/work/interior:ro
  - interior_modules:/work/interior/node_modules:ro
  - ./simulation:/work/simulation:ro
  - ./materials/themes:/work/materials/themes:ro
  - ${URBE_MODELS_DIR:-~/models/quaternius}:/work/models:ro

services:
  atlas:
    <<: *box
    working_dir: /work/atlas
    environment:
      <<: *user
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5301", "--strictPort"]
    ports:
      - "127.0.0.1:5301:5301"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./atlas:/work/atlas
      - atlas_modules:/work/atlas/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5301/"]

  connections:
    <<: *box
    working_dir: /work/connections
    # Vite plugin serves the atlas sample blueprint from ATLAS_BLUEPRINT (relative to the box).
    environment:
      <<: *user
      ATLAS_BLUEPRINT: ../atlas/samples/city-urbe.json
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5302", "--strictPort"]
    ports:
      - "127.0.0.1:5302:5302"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./connections:/work/connections
      - connections_modules:/work/connections/node_modules
      - ./atlas:/work/atlas:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5302/"]

  exterior:
    <<: *box
    working_dir: /work/exterior
    environment:
      <<: *user
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5303", "--strictPort"]
    ports:
      - "127.0.0.1:5303:5303"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./exterior:/work/exterior
      - exterior_modules:/work/exterior/node_modules
      - ./interior/schemas:/work/interior/schemas:ro
      - ./materials/themes:/work/materials/themes:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5303/"]

  interior:
    <<: *box
    working_dir: /work/interior
    environment:
      <<: *user
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5304", "--strictPort"]
    ports:
      - "127.0.0.1:5304:5304"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./interior:/work/interior
      - interior_modules:/work/interior/node_modules
      - ./materials/themes:/work/materials/themes:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5304/"]

  simulation:
    <<: *box
    working_dir: /work/simulation
    # `npm run build` compiles the library to dist/ (the engine imports it); `npm run testbed`
    # builds the 2D preview and serves the box root on PORT (per its README), page at /testbed/.
    environment:
      <<: *user
      PORT: "5305"
    command: ["sh", "-c", "npm run build && npm run testbed"]
    ports:
      - "127.0.0.1:5305:5305"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./simulation:/work/simulation
      - simulation_modules:/work/simulation/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5305/testbed/"]

  quests:
    <<: *box
    working_dir: /work/quests
    # `npm run watch` compiles the library to dist/ (the engine's talk route imports it) and
    # keeps it current; healthy once the build exists.
    environment:
      <<: *user
    command: ["/work/quests-start.sh"]
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./compose/quests-start.sh:/work/quests-start.sh:ro
      - ./quests:/work/quests
      - quests_modules:/work/quests/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "test", "-f", "/tmp/urbe-quests-ready"]

  engine-world:
    <<: *box
    working_dir: /work/engine
    environment:
      <<: *user
    command: ["npm", "run", "assemble-city", "--", "--blueprint", "/work/atlas/samples/city-urbe-tiny.json", "--out", "/work/engine/out/city-tiny", "--interiors", "5"]
    depends_on:
      atlas:
        condition: service_healthy
      exterior:
        condition: service_healthy
      interior:
        condition: service_healthy
    volumes: *engine-volumes

  engine:
    <<: *box
    working_dir: /work/engine
    # Dev mode imports the sibling boxes in place: atlas samples, connections, exterior and
    # interior source with their installed dependencies, the quests and simulation builds,
    # and the materials theme database served under /materials/. The CC0 character,
    # animation and vehicle packs come from the machine's model store (URBE_MODELS_DIR on
    # the host, default ~/models/quaternius) served under /models/. NPC dialog runs on the
    # machine's OpenAI-compatible model server (LLM_BASE_URL on the host, default port 8080).
    environment:
      <<: *user
      URBE_MODELS_DIR: /work/models
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5306", "--strictPort"]
    ports:
      - "127.0.0.1:5306:5306"
    depends_on:
      atlas:
        condition: service_healthy
      engine-world:
        condition: service_completed_successfully
      exterior:
        condition: service_healthy
      interior:
        condition: service_healthy
      simulation:
        condition: service_healthy
      quests:
        condition: service_healthy
    volumes: *engine-volumes
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5306/"]

  materials:
    <<: *box
    working_dir: /work/materials
    environment:
      <<: *user
    # Sphere viewer over the committed theme database; the read path needs no ComfyUI.
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5307", "--strictPort"]
    ports:
      - "127.0.0.1:5307:5307"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./materials:/work/materials
      - materials_modules:/work/materials/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5307/"]

volumes:
  atlas_modules:
  connections_modules:
  exterior_modules:
  interior_modules:
  simulation_modules:
  quests_modules:
  engine_modules:
  materials_modules:
