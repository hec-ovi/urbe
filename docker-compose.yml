# Urbe preview stack: every box's documented dev/preview server on a fixed port.
# compose/box-start.sh installs a box into its named volume the first time and again
# whenever its package-lock.json changes. Wipe every install: docker compose down -v

name: urbe

x-box: &box
  image: node:22
  init: true
  entrypoint: /work/box-start.sh

# The user every box runs as; override with BOX_UID=$(id -u) BOX_GID=$(id -g) when not 1000.
x-user: &user
  BOX_UID: "${BOX_UID:-1000}"
  BOX_GID: "${BOX_GID:-1000}"

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 180s

services:
  atlas:
    <<: *box
    working_dir: /work/atlas
    environment:
      <<: *user
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5301", "--strictPort"]
    ports:
      - "5301:5301"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./atlas:/work/atlas
      - atlas_modules:/work/atlas/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5301/"]

  connections:
    <<: *box
    working_dir: /work/connections
    # Vite plugin serves the atlas sample blueprint from ATLAS_BLUEPRINT (relative to the box).
    environment:
      <<: *user
      ATLAS_BLUEPRINT: ../atlas/samples/city-urbe.json
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5302", "--strictPort"]
    ports:
      - "5302:5302"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./connections:/work/connections
      - connections_modules:/work/connections/node_modules
      - ./atlas:/work/atlas:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5302/"]

  exterior:
    <<: *box
    working_dir: /work/exterior
    environment:
      <<: *user
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5303", "--strictPort"]
    ports:
      - "5303:5303"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./exterior:/work/exterior
      - exterior_modules:/work/exterior/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5303/"]

  interior:
    <<: *box
    working_dir: /work/interior
    environment:
      <<: *user
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5304", "--strictPort"]
    ports:
      - "5304:5304"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./interior:/work/interior
      - interior_modules:/work/interior/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5304/"]

  simulation:
    <<: *box
    working_dir: /work/simulation
    # `npm run build` compiles the library to dist/ (the engine imports it); `npm run testbed`
    # builds the 2D preview and serves the box root on PORT (per its README), page at /testbed/.
    environment:
      <<: *user
      PORT: "5305"
    command: ["sh", "-c", "npm run build && npm run testbed"]
    ports:
      - "5305:5305"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./simulation:/work/simulation
      - simulation_modules:/work/simulation/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5305/testbed/"]

  engine:
    <<: *box
    working_dir: /work/engine
    # Dev mode imports the sibling boxes in place: atlas samples, connections and interior
    # source (interior with its installed dependencies), exterior schemas, the simulation
    # build, and the materials theme database served under /materials/. The CC0 character,
    # animation and vehicle packs come from the machine's model store (URBE_MODELS_DIR on
    # the host, default ~/models/quaternius) served under /models/.
    environment:
      <<: *user
      URBE_MODELS_DIR: /work/models
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5306", "--strictPort"]
    ports:
      - "5306:5306"
    depends_on:
      simulation:
        condition: service_healthy
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./engine:/work/engine
      - engine_modules:/work/engine/node_modules
      - ./atlas:/work/atlas:ro
      - ./connections:/work/connections:ro
      - ./exterior:/work/exterior:ro
      - ./interior:/work/interior:ro
      - interior_modules:/work/interior/node_modules:ro
      - ./simulation:/work/simulation:ro
      - ./materials/themes:/work/materials/themes:ro
      - ${URBE_MODELS_DIR:-~/models/quaternius}:/work/models:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5306/"]

  materials:
    <<: *box
    working_dir: /work/materials
    environment:
      <<: *user
    # Sphere viewer over the committed theme database; the read path needs no ComfyUI.
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5307", "--strictPort"]
    ports:
      - "5307:5307"
    volumes:
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./materials:/work/materials
      - materials_modules:/work/materials/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5307/"]

volumes:
  atlas_modules:
  connections_modules:
  exterior_modules:
  interior_modules:
  simulation_modules:
  engine_modules:
  materials_modules:
