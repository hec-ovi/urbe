# Urbe preview stack: every box's documented dev/preview server on a fixed port.
# compose/box-start.sh checks the lock hash when a service starts and installs into its
# named volume when needed. Wipe every install: docker compose down -v

name: urbe

x-box: &box
  image: node:22
  init: true
  entrypoint: /work/box-start.sh

# The user every box runs as; override with BOX_UID=$(id -u) BOX_GID=$(id -g) when not 1000.
x-user: &user
  BOX_UID: "${BOX_UID:-1000}"
  BOX_GID: "${BOX_GID:-1000}"
  BOX_OFFLINE_INSTALL: "${BOX_OFFLINE_INSTALL:-0}"

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 180s

x-install-cache: &install-cache npm_cache:/root/.npm

x-engine-volumes: &engine-volumes
  - *install-cache
  - ./compose/box-start.sh:/work/box-start.sh:ro
  - ./engine:/work/engine
  - ./quests:/work/quests:ro
  - quests_modules:/work/quests/node_modules:ro
  - engine_modules:/work/engine/node_modules
  - ./atlas:/work/atlas:ro
  - atlas_modules:/work/atlas/node_modules:ro
  - ./connections:/work/connections:ro
  - connections_modules:/work/connections/node_modules:ro
  - ./streets:/work/streets:ro
  - streets_modules:/work/streets/node_modules:ro
  - ./exterior:/work/exterior:ro
  - exterior_modules:/work/exterior/node_modules:ro
  - ./interior:/work/interior:ro
  - interior_modules:/work/interior/node_modules:ro
  - ./simulation:/work/simulation:ro
  - ./materials/themes:/work/materials/themes:ro
  - ./materials/bindings:/work/materials/bindings:ro
  - ./materials/schema:/work/materials/schema:ro
  - ${URBE_MODELS_DIR:-~/models/quaternius}:/work/models:ro

services:
  streets:
    <<: *box
    working_dir: /work/streets
    environment:
      <<: *user
    command: ["sh", "-c", "npm run build && touch /tmp/urbe-streets-ready && exec sleep infinity"]
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./streets:/work/streets
      - streets_modules:/work/streets/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "test", "-f", "/tmp/urbe-streets-ready"]

  atlas:
    <<: *box
    working_dir: /work/atlas
    environment:
      <<: *user
      ATLAS_ENGINE_API_URL: http://engine:5306
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5301", "--strictPort"]
    ports:
      - "127.0.0.1:5301:5301"
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./atlas:/work/atlas
      - atlas_modules:/work/atlas/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5301/"]

  connections:
    <<: *box
    working_dir: /work/connections
    # Vite plugin serves the atlas sample blueprint from ATLAS_BLUEPRINT (relative to the box).
    environment:
      <<: *user
      ATLAS_BLUEPRINT: ../atlas/samples/city-urbe.json
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5302", "--strictPort"]
    ports:
      - "127.0.0.1:5302:5302"
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./connections:/work/connections
      - connections_modules:/work/connections/node_modules
      - ./atlas:/work/atlas:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5302/"]

  exterior:
    <<: *box
    working_dir: /work/exterior
    environment:
      <<: *user
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5303", "--strictPort"]
    ports:
      - "127.0.0.1:5303:5303"
    depends_on:
      interior:
        condition: service_healthy
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./exterior:/work/exterior
      - exterior_modules:/work/exterior/node_modules
      - ./interior/schemas:/work/interior/schemas:ro
      - ./interior/dist:/work/interior/dist:ro
      - ./materials/themes:/work/materials/themes:ro
      - ./materials/bindings:/work/materials/bindings:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5303/"]

  interior:
    <<: *box
    working_dir: /work/interior
    environment:
      <<: *user
    command: ["sh", "-c", "npm run build:feasibility && exec npm run preview -- --host 0.0.0.0 --port 5304 --strictPort"]
    ports:
      - "127.0.0.1:5304:5304"
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./interior:/work/interior
      - interior_modules:/work/interior/node_modules
      - ./materials/themes:/work/materials/themes:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5304/"]

  simulation:
    <<: *box
    working_dir: /work/simulation
    # `npm run build` compiles the library to dist/ (the engine imports it); `npm run testbed`
    # builds the 2D preview and serves the box root on PORT (per its README), page at /testbed/.
    environment:
      <<: *user
      PORT: "5305"
    command: ["sh", "-c", "npm run build && npm run testbed"]
    ports:
      - "127.0.0.1:5305:5305"
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./simulation:/work/simulation
      - simulation_modules:/work/simulation/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5305/testbed/"]

  naming:
    <<: *box
    working_dir: /work/naming
    # The Naming CLI for an author agent naming a plan Engine made; no part of the running
    # stack. Mount the plan's folder and run the external author mode (README, Authoring):
    # docker compose run --rm -T -v "$PWD/engine/out/plans/<id>:/plan" naming sh -c
    #   'npm run --silent build >&2 && npm run --silent world -- /plan --theme "<theme>" --external /plan/author'
    profiles: ["author"]
    environment:
      <<: *user
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./naming:/work/naming
      - naming_modules:/work/naming/node_modules

  quests:
    <<: *box
    working_dir: /work/quests
    # `npm run watch` compiles the library to dist/ (the engine's talk route imports it) and
    # keeps it current; healthy once the build exists. Engine replays stories with its
    # materialize CLI in place.
    environment:
      <<: *user
    command: ["/work/quests-start.sh"]
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./compose/quests-start.sh:/work/quests-start.sh:ro
      - ./quests:/work/quests
      - quests_modules:/work/quests/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "test", "-f", "/tmp/urbe-quests-ready"]

  engine:
    <<: *box
    working_dir: /work/engine
    # Play mode imports the sibling boxes in place: atlas samples, connections, exterior and
    # interior source with their installed dependencies, the quests and simulation builds,
    # and the materials theme database served under /materials/. The CC0 character,
    # animation and vehicle packs come from the machine's model store (URBE_MODELS_DIR on
    # the host, default ~/models/quaternius) served under /models/. NPC dialog runs on the
    # machine's OpenAI-compatible model server (LLM_BASE_URL on the host, default port 8080);
    # creation asks no model.
    # NPC speech goes to the voice service when its profile runs (VOICE_BASE_URL); Engine
    # starts without it.
    environment:
      <<: *user
      URBE_MODELS_DIR: /work/models
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: engine
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      VOICE_BASE_URL: ${VOICE_BASE_URL:-http://voice:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "play", "--", "--host", "0.0.0.0", "--port", "5306", "--strictPort"]
    ports:
      - "127.0.0.1:5306:5306"
    depends_on:
      atlas:
        condition: service_healthy
      streets:
        condition: service_healthy
      exterior:
        condition: service_healthy
      interior:
        condition: service_healthy
      simulation:
        condition: service_healthy
      quests:
        condition: service_healthy
    volumes: *engine-volumes
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5306/"]

  materials:
    <<: *box
    working_dir: /work/materials
    environment:
      <<: *user
    # Sphere viewer over the committed theme database; the read path needs no ComfyUI.
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5307", "--strictPort"]
    ports:
      - "127.0.0.1:5307:5307"
    volumes:
      - *install-cache
      - ./compose/box-start.sh:/work/box-start.sh:ro
      - ./materials:/work/materials
      - materials_modules:/work/materials/node_modules
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:5307/"]

  # Maya1 speech tokens on the GPU: llama.cpp's Vulkan server with the voice GGUF from the
  # machine's model store (URBE_GGUF_DIR, default ~/models/gguf). One slot, so one line fills
  # the 4096-token context at a time. Profile voice: COMPOSE_PROFILES=voice in .env.
  voice-model:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11176
    init: true
    profiles: ["voice"]
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ${URBE_GGUF_DIR:-~/models/gguf}:/models:ro
    command: ["--model", "/models/${URBE_VOICE_MODEL:-maya1/maya1-q4_k_m.gguf}", "--alias", "maya1",
              "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "4096", "--parallel", "1",
              "--cache-ram", "0", "-ngl", "99"]
    ports:
      - "127.0.0.1:5309:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]

  # NPC speech: designs each speaker's voice, streams WAV and keeps a byte-capped cache in
  # the voice_data volume. Profile voice.
  voice:
    build: ./voice
    init: true
    profiles: ["voice"]
    environment:
      MAYA1_URL: http://voice-model:8080
      VOICE_CACHE_MAX_MB: ${VOICE_CACHE_MAX_MB:-512}
      VOICE_ACCENTS: ${VOICE_ACCENTS:-American accent,British accent}
    ports:
      - "127.0.0.1:5308:8080"
    depends_on:
      voice-model:
        condition: service_healthy
    volumes:
      - voice_data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]

volumes:
  npm_cache:
  atlas_modules:
  streets_modules:
  connections_modules:
  exterior_modules:
  interior_modules:
  simulation_modules:
  quests_modules:
  naming_modules:
  engine_modules:
  materials_modules:
  voice_data:
